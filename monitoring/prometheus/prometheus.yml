global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "auth-service"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "auth-service:3001"

  - job_name: "user-service"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "user-service:3002"

  - job_name: "order-service"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "order-service:3003"

  - job_name: "payment-service"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "payment-service:3004"